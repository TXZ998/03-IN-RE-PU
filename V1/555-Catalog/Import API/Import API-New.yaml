openapi: 3.1.0
info:
  version: v1
  title: Airport CRUD API
  description: API to create, read, update and delete the airport and tabs
  termsOfService: https://developer.champ.aero/terms
  contact:
    email: api.gateway@champ.aero
    name: CHAMP Cargosystems
servers:
  - description: SwaggerHub API Auto Mocking
    url: https://virtserver.swaggerhub.com/CHAMP-Cargo-Systems/airport-OCP-CSP/v1
  - description: SwaggerHub API Auto Mocking
    url: https://virtserver.swaggerhub.com/CHAMP-Cargo-Systems/AirportFacilitiesAPI/v1
  - url: https://api.champ.aero/csp/master-data/v2/airports
security:
  - ApiKeyAuth: []
  - ApiKeyAuth: []
    BearerAuth: []
tags:
  - name: airport-controller
    description: Create, read, update and delete airport and tabs
paths:
  /airports:
    post:
      tags:
        - airport-controller
      summary: Create airport and tabs
      operationId: create
      description: API to create airport and tabs
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewAirport"
        description: Airport request parameter
        required: true
      responses:
        "201":
          description: Created
          content: {}
        "400":
          description: Invalid parameter/value
          content: {}
        "401":
          description: Unauthorized (Authentication not done)
          content: {}
        "403":
          description: Forbidden (No access rights to the content)
          content: {}
        "404":
          description: Not found
          content: {}
        "409":
          description: Airport exist
          content: {}
        "412":
          description: Precondition Failed
          content: {}
        "422":
          description: Unprocessable Entity (Semantic error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  "/airports/{code}":
    get:
      tags:
        - airport-controller
      summary: Get airport and tabs
      operationId: get
      description: API to get airport and tabs
      parameters:
        - name: code
          in: path
          description: Airport code to get airport and tabs
          required: true
          schema:
            type: string
            examples: LHR
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AirportResponse"
        "400":
          description: Invalid parameter/value
          content: {}
        "401":
          description: Unauthorized (Authentication not done)
          content: {}
        "403":
          description: Forbidden (No access rights to the content)
          content: {}
        "404":
          description: Not found
          content: {}
        "412":
          description: Precondition Failed
          content: {}
        "422":
          description: Unprocessable Entity (Semantic error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too Many Requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  fault:
                    type: object
                    properties:
                      faultstring:
                        type: string
                        example: Rate limit quota violation. Quota limit exceeded.
                      detail:
                        type: object
                        properties:
                          errorcode:
                            type: string
                            example: policies.ratelimit.QuotaViolation
    put:
      tags:
        - airport-controller
      summary: Update airport and tabs
      operationId: update
      description: API to update airport and tabs
      parameters:
        - name: code
          in: path
          description: Airport code to update airport and tabs
          required: true
          schema:
            type: string
            examples: LHR
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAirport"
        required: true
      responses:
        "204":
          description: No Content
          content: {}
        "400":
          description: Invalid parameter/value
          content: {}
        "401":
          description: Unauthorized (Authentication not done)
          content: {}
        "403":
          description: Forbidden (No access rights to the content)
          content: {}
        "404":
          description: Not found
          content: {}
        "412":
          description: Precondition Failed
          content: {}
        "422":
          description: Unprocessable Entity (Semantic error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
        - airport-controller
      summary: Delete airport and tabs
      operationId: delete
      description: API to delete airport and tabs
      parameters:
        - name: code
          in: path
          description: Airport code to delete airport and tabs
          required: true
          schema:
            type: string
            examples: LHR
      responses:
        "204":
          description: No Content
          content: {}
        "400":
          description: Invalid parameter/value
          content: {}
        "401":
          description: Unauthorized (Authentication not done)
          content: {}
        "403":
          description: Forbidden (No access rights to the content)
          content: {}
        "404":
          description: Not found
          content: {}
        "412":
          description: Precondition Failed
          content: {}
        "422":
          description: Unprocessable Entity (Semantic error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
